spring.application.name=movieinfo-service
server.port=8081
server.address=0.0.0.0
api.key=anyRandomText123

# Actuator config for K8s liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Disable unused Spring Cloud config (clean leftover config)
spring.cloud.discovery.enabled=false

# Logging convenient for K8s container logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n