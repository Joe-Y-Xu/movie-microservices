apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-catalog-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: artifact-catalog-service
  template:
    metadata:
      labels:
        app: artifact-catalog-service
    spec:
      containers:
      - name: artifact-catalog
        image: artifact-catalog-service:v1
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5